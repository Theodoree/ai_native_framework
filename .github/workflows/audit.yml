name: audit

# 审计执行层：findings 来自上游（沙盒 / GitHub 侧各自注入），这里只做
# 「校验 schema -> 合并多个执行器 -> 逐条比对 -> 回写 Check Run」。
# 评论不算门：合并判据是名为 audit 的 Check Run，而不是 PR 里的一条评论。
# 取数与判定之间只有一个接口：findings 文件。两个「落盘」步骤把上游执行器的
# 结论写到 .audit/review-a.json / .audit/review-b.json（AUDIT_FINDINGS_A/B 由上游 job
# 或仓库变量注入，本 workflow 不自己跑模型）。上游什么都没给时写的是 INFRA 记录，
# 不是「空 findings 的 pass」—— 没跑到不能写成跑到并通过。
#
# 路由（哪家模型）不在 CI 里：本文件只出现逻辑名 review-a / review-b，真源在
# .agents/platform/routing.yml（docs/audit-contract.md 四）。

# 触发面刻意只有手动：手动 dispatch 时由 inputs 注入两个执行器的 findings（真跑用），
# 不注入就落 INFRA。不挂 pull_request 的理由是 merge-gate 的 G3 要求每个非自身 check 都是
# success，于是一个可能产出 action_required 的 check 会把**每一次**合并都挡死——那不是诚实，
# 那是结构性死锁，而且会训练人忽略红灯。等上游真执行器能保证「PR 事件一律有结论」之后再
# 打开 pull_request 触发；届时同步改掉 tests/audit-findings.test.mjs 里钉住触发面的那个用例。
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "要审计的 PR 号"
        required: true
      findings_a:
        description: "review-a 的 findings（JSON；留空则该执行器记 INFRA）"
        required: false
        default: ""
      findings_b:
        description: "review-b 的 findings（JSON；留空则该执行器记 INFRA）"
        required: false
        default: ""

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: audit-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只有一条取数路径：PR 号从事件或手改输入来，head sha 一律问 PR 本身。
      # 不读 github.event.pull_request.head.sha —— 手动触发时它是空串，
      # 而空 head_sha 的 Check Run 会被 GitHub 拒，或更糟：落到一个没人看的 sha 上。
      - name: 解析 PR 上下文
        id: ctx
        env:
          PR_INPUT: ${{ inputs.pr }}
          PR_EVENT: ${{ github.event.pull_request.number }}
        run: |
          pr="${PR_INPUT:-${PR_EVENT:-}}"
          if [ -z "$pr" ]; then echo "::error::没有 PR 号（事件里没有，输入也没给）"; exit 1; fi
          sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
          if [ -z "$sha" ]; then echo "::error::取不到 PR #$pr 的 head sha"; exit 1; fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PR=#$pr head=$sha"

      - name: 变更路径
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          mkdir -p .audit
          gh pr view "$PR" --json files --jq '.files[].path' > .audit/changed-paths.txt

      # 值只经 env 进入脚本：JSON 里的引号/换行由 env 原样传递，
      # 绝不在 run 里内联输入（那是一次 shell 拼接）。
      - name: 落盘 review-a
        env:
          AUDIT_FINDINGS_A: ${{ inputs.findings_a }}
        run: |
          mkdir -p .audit
          AUDIT_SLOT=review-a AUDIT_EXECUTOR=sandbox AUDIT_INPUT="$AUDIT_FINDINGS_A" node -e '
            const fs = require("node:fs");
            const input = process.env.AUDIT_INPUT;
            const body = input && input.trim() !== "" ? input : JSON.stringify({
              verdict: "INFRA",
              findings: [],
              evidence: { executor: process.env.AUDIT_EXECUTOR, agent: process.env.AUDIT_SLOT },
              reason: "上游未注入 findings（AUDIT_FINDINGS_A 为空）：判不了，不是通过",
            });
            fs.writeFileSync(".audit/" + process.env.AUDIT_SLOT + ".json", body);
          '

      - name: 落盘 review-b
        env:
          AUDIT_FINDINGS_B: ${{ inputs.findings_b }}
        run: |
          mkdir -p .audit
          AUDIT_SLOT=review-b AUDIT_EXECUTOR=github AUDIT_INPUT="$AUDIT_FINDINGS_B" node -e '
            const fs = require("node:fs");
            const input = process.env.AUDIT_INPUT;
            const body = input && input.trim() !== "" ? input : JSON.stringify({
              verdict: "INFRA",
              findings: [],
              evidence: { executor: process.env.AUDIT_EXECUTOR, agent: process.env.AUDIT_SLOT },
              reason: "上游未注入 findings（AUDIT_FINDINGS_B 为空）：判不了，不是通过",
            });
            fs.writeFileSync(".audit/" + process.env.AUDIT_SLOT + ".json", body);
          '

      - name: verdict
        id: decide
        run: |
          set +e
          node scripts/audit-findings.mjs --a .audit/review-a.json --b .audit/review-b.json --out .audit/result.json
          code=$?
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(".audit/result.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            const lines = [];
            for (const e of r.executors) lines.push(e.slot + ": 申报=" + e.declared + " 计入=" + e.effective + " schema=" + (e.valid ? "ok" : "不合格") + " findings=" + e.findings.length);
            if (r.comparison) lines.push("agreed=" + r.comparison.counts.agreed + " onlyA=" + r.comparison.counts.onlyA + " onlyB=" + r.comparison.counts.onlyB + " severityMismatch=" + r.comparison.counts.severityMismatch);
            fs.appendFileSync(out, "verdict=" + r.verdict + "\n");
            fs.appendFileSync(out, "conclusion=" + r.conclusion + "\n");
            fs.writeFileSync(".audit/check-run.json", JSON.stringify({
              name: "audit",
              head_sha: process.env.AUDIT_SHA,
              status: "completed",
              conclusion: r.conclusion,
              output: { title: "audit " + r.verdict, summary: lines.join("\n").slice(0, 60000) },
            }));
          '
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          AUDIT_SHA: ${{ steps.ctx.outputs.sha }}

      - name: Check Run
        run: |
          gh api repos/$GITHUB_REPOSITORY/check-runs --method POST --input .audit/check-run.json --jq '.id'

      - name: INFRA 留痕
        if: steps.decide.outputs.conclusion == 'action_required'
        run: |
          {
            echo '## audit: INFRA（判不了，不是通过）'
            echo ''
            echo '上游执行器没有给出可用结论（超时 / 额度耗尽 / 模型不可达，或 schema 不合格）。'
            echo 'INFRA 不计入合并判据，但必须落在这里，不许静默当通过。'
            echo ''
            echo '```'
            cat .audit/result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning title=audit INFRA::判不了，不是通过；详情见本次运行摘要'

      - name: 判定
        run: exit ${{ steps.decide.outputs.exit }}
