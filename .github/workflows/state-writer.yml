# 状态机唯一写者：issue 状态只在本 workflow 里被改
# 事件 → 意图（build-intent）→ 判定（state-validate）→ 合法才写，非法回滚并留痕。
name: state-writer

on:
  issues:
    types: [opened, labeled, closed, reopened]
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: state-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install

      # 事件 → 意图。身份只从宿主字段推，不读调用方自述。
      # NUMBER 是事件自身的号（issue 或 PR），只用来取上下文与留痕位置，不当 issue 号用。
      # 有没有意图由 build-intent 自己写进 has_intent（它是意图的产地），
      # YAML 不猜、也不在这里做任何判定：没有意图 = 后续三步全部不跑，job 保持绿。
      - name: build intent
        id: intent
        env:
          EVENT: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          LAST_COMMENT="$(gh api "repos/${{ github.repository }}/issues/${NUMBER}/comments" --jq '.[-1].body // ""' 2>/dev/null || echo "")"
          export LAST_COMMENT
          node scripts/build-intent.mjs > intent.json

      - name: validate
        id: validate
        if: steps.intent.outputs.has_intent == '1'
        run: |
          set +e
          node scripts/state-validate.mjs --intent intent.json --json > verdict.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat verdict.json

      # PR 事件也不改 PR 号上的标签：改的是意图解析出的 issue。
      - name: apply
        if: steps.intent.outputs.has_intent == '1' && steps.validate.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="$(node -p "require('./intent.json').issue")"
          FROM="$(node -p "require('./verdict.json').from")"
          TO="$(node -p "require('./verdict.json').to")"
          if [ "$FROM" != "none" ]; then
            gh issue edit "$ISSUE" --remove-label "state:$FROM"
          fi
          gh issue edit "$ISSUE" --add-label "state:$TO"

      # 拒绝与 INFRA 都留痕（留在事件自身的号上，PR 事件就留在 PR 上）；
      # 正文格式与 job 红绿只由 writer-record.mjs 决定：rejected→0，infra→1。
      # has_intent 必须为 1：没有意图就没有判定结果可留痕，空 intent.json 绝不能进到这里
      # （validate 被跳过时它的 exit 输出为空，单看 exit != '0' 会误命中）。
      - name: record
        if: steps.intent.outputs.has_intent == '1' && steps.validate.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: node scripts/writer-record.mjs --verdict verdict.json --issue "$NUMBER"
