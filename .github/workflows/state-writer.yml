# 状态机唯一写者：issue 状态只在本 workflow 里被改
# 事件 → 意图（build-intent）→ 判定（state-validate）→ 合法才写，非法回滚并留痕。
name: state-writer

on:
  issues:
    types: [opened, labeled, closed, reopened]
  pull_request:
    types: [opened, synchronize, closed]

# 合法路径（allowed）本就不评论，但非法路径（rejected/infra）必须能贴上评论：
# issue 评论走 issues: write；留痕的兜底位置是事件自身的号，PR 号上的评论由
# gh 走 GraphQL，只有 issues: write 会被拒（真 PR #2：Resource not accessible by integration）。
permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: state-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install

      # 判据与门的调用点是 Go 引擎（apps/engine），Node 版脚本留作 parity 对照（tests 两侧同口径）。
      # 构建入口只有一个：npm run build:engine → .cache/bin/engine（.cache/ 已忽略，产物不进仓库）。
      # 这一步刻意不写 name：测试沙箱只跑「有 name 的步骤」，构建不该在沙箱里重跑。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: npm run build:engine

      # PR 号不是 issue 号，且 PR 事件的 payload 里没有被引用 issue 的标签。
      # 所以「先解析 issue、再取它的当前状态、再建意图」是三个有先后依赖的步骤，
      # 顺序用步骤图表达（Actions 按序执行），不塞进一行 shell 拼接里：
      # 顺序一错（先建意图再取数）就会退回真 PR #2 的 from=none。
      - name: resolve issue
        id: resolve
        env:
          EVENT: ${{ toJSON(github.event) }}
        run: |
          ISSUE="$(./.cache/bin/engine build-intent --resolve-issue)"
          echo "issue=${ISSUE}" >> "$GITHUB_OUTPUT"
          echo "referenced issue: ${ISSUE:-<none>}"

      # 唯一有网络权限的地方：取被引用 issue 的**真实当前状态**。
      # 解不出 issue 就不取（steps.resolve.outputs.issue 为空），判定器会判 INFRA。
      - name: fetch issue state
        id: issue_state
        if: steps.resolve.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ steps.resolve.outputs.issue }}" \
            --jq '{labels: [.labels[].name]}' > issue-state.json
          cat issue-state.json

      # 守卫证据只能来自宿主事实：合并之后 merge-gate 到底绿没绿，只有那个提交上的
      # check run 知道，写者没有资格替它作证。所以这里去宿主取，取到的只是「事实摘要」。
      # 取不到（没有这条 check / 结论不是 success / 接口报错）就**不写文件**，也绝不
      # 因此让 job 失败：没证据 → 判定器 reject E_GUARD_MISSING → 状态不改，这是设计好的
      # 正常路径；把它做成红 job 反而会把「守卫拦住了」伪装成「流水线坏了」。
      - name: fetch guard evidence
        id: guard_evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # 选择规则本身必须被测过：jq 表达式在假 gh 里替换不掉，测不到就只能靠人看。
          # 所以这里只取原始 JSON，筛谁、算不算成功都交给下面的 node 脚本。
          RAW="$(mktemp)"
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" > "$RAW" 2>/dev/null; then
            echo "merge-gate：取 ${HEAD_SHA} 的 check run 失败 → 不写守卫证据（判定将 reject E_GUARD_MISSING）" >> "$SUMMARY"
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const [rawPath, sha, pr, summaryPath] = process.argv.slice(1);
            const note = (line) => fs.appendFileSync(summaryPath, line + "\n");
            const giveUp = (reason) => {
              note("merge-gate：" + reason + " → 不写守卫证据（判定将 reject E_GUARD_MISSING）");
              process.exit(0);
            };
            let runs = [];
            try {
              const parsed = JSON.parse(fs.readFileSync(rawPath, "utf8"));
              runs = Array.isArray(parsed && parsed.check_runs) ? parsed.check_runs : [];
            } catch (error) {
              giveUp(sha + " 的 check run 列表读不出来（" + error.message + "）");
            }
            const matched = runs.filter((run) => run && run.name === "merge-gate");
            if (matched.length === 0) giveUp(sha + " 上没有名为 merge-gate 的 check run");
            if (matched.length > 1) giveUp(sha + " 上有 " + matched.length + " 条同名 merge-gate，无法确定以哪条为准");
            const run = matched[0];
            if (run.conclusion !== "success") giveUp("check run " + run.id + " 的结论是 " + (run.conclusion || "<空>") + "，不是 success");
            fs.writeFileSync("guard-evidence.json", JSON.stringify({ "merge-gate": "check run " + run.id + " merge-gate success on " + sha + "（PR #" + pr + " 已合并）" }));
            note("merge-gate：check run " + run.id + " success on " + sha + " → 已写 guard-evidence.json");
          ' "$RAW" "${HEAD_SHA}" "${PR_NUMBER}" "$SUMMARY"

      # 事件 → 意图。身份只从宿主字段推，不读调用方自述。
      # 脚本不联网：issue 的当前状态从 ISSUE_STATE_FILE 注入（上一取的产物），
      # 守卫证据从 GUARD_EVIDENCE_FILE 注入（上一步的产物，取不到时该文件不存在）。
      # NUMBER 是事件自身的号（issue 或 PR），只用来取上下文与留痕的兜底位置，不当 issue 号用。
      # 有没有意图由 build-intent 自己写进 has_intent（它是意图的产地），
      # YAML 不猜、也不在这里做任何判定：没有意图 = 后续三步全部不跑，job 保持绿。
      - name: build intent
        id: intent
        env:
          EVENT: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_STATE_FILE: issue-state.json
          GUARD_EVIDENCE_FILE: guard-evidence.json
        run: |
          LAST_COMMENT="$(gh api "repos/${{ github.repository }}/issues/${NUMBER}/comments" --jq '.[-1].body // ""' 2>/dev/null || echo "")"
          export LAST_COMMENT
          ./.cache/bin/engine build-intent > intent.json

      - name: validate
        id: validate
        if: steps.intent.outputs.has_intent == '1'
        run: |
          set +e
          ./.cache/bin/engine validate --intent intent.json --json > verdict.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat verdict.json

      # PR 事件也不改 PR 号上的标签：改的是意图解析出的 issue。
      - name: apply
        if: steps.intent.outputs.has_intent == '1' && steps.validate.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="$(node -p "require('./intent.json').issue")"
          FROM="$(node -p "require('./verdict.json').from")"
          TO="$(node -p "require('./verdict.json').to")"
          if [ "$FROM" != "none" ]; then
            gh issue edit "$ISSUE" --remove-label "state:$FROM"
          fi
          gh issue edit "$ISSUE" --add-label "state:$TO"

      # 拒绝与 INFRA 都留痕，位置与 apply 同源：被改动的那个 issue（intent.json 的 issue），
      # 不是事件自身的 PR 号。只有「连 issue 都解不出」时才没有可落的目标 ——
      # 那时改动为零，评论只是报告，落在事件主体上，PR 号在那里是主体而非被冒充的 issue 号。
      # 正文格式与 job 红绿只由 writer-record.mjs 决定：rejected→0，infra→1（留痕失败也红）。
      # has_intent 必须为 1：没有意图就没有判定结果可留痕，空 intent.json 绝不能进到这里
      # （validate 被跳过时它的 exit 输出为空，单看 exit != '0' 会误命中）。
      - name: record
        if: steps.intent.outputs.has_intent == '1' && steps.validate.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          TARGET="$(node -p "const i = require('./intent.json').issue; Number.isInteger(i) ? i : process.env.NUMBER")"
          ./.cache/bin/engine writer-record --verdict verdict.json --issue "$TARGET"
