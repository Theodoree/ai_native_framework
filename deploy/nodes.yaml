# 节点模板表 —— 平台起容器时读的就是这个文件（apps/chain -templates 的默认值）。
#
# 三种角色：templates 说「用哪个镜像、跑什么命令、给多少时间」，nodes 说
# 「链条上哪一站用哪个模板」。改这里不需要改 Go 代码、也不需要重新编译。
#
# 镜像怎么来：deploy/agent-image/build-images.sh 三条 docker build 就得到下面
# 这三个 tag。换成你自己的 registry 地址也只需要改 image 这一行。
version: 1

templates:
  codex:
    # 本地 build 的 tag，或换你的 registry 地址（如 registry.example.com/agent-codex:1.2）
    image: ai-native/agent-codex:dev
    command: ["/opt/agent/entrypoint.sh"]
    timeout: 30m
    env:
      AGENT_NAME: codex

  claude:
    image: ai-native/agent-claude:dev
    command: ["/opt/agent/entrypoint.sh"]
    timeout: 30m
    env:
      AGENT_NAME: claude

  deepseek-harness:
    image: ai-native/agent-deepseek-harness:dev
    command: ["/opt/agent/entrypoint.sh"]
    timeout: 30m
    env:
      AGENT_NAME: deepseek-harness

# 六类节点各用哪个模板。空字符串 = 空节点，由人动手，不起容器。
nodes:
  create: deepseek-harness   # 需求入链：读需求、拆站
  assess: deepseek-harness   # 评审可行性
  dev: ""                    # 空节点：人写代码
  crosstest: codex           # 交叉测试
  merge: ""                  # 空节点：人合入
  release: claude            # 发布确认
