<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>链条平台</title>
    <style>
      :root { --line: #d8dce3; --ink: #1c2024; --dim: #6b7280; --bg: #f6f7f9; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.55 -apple-system, "PingFang SC", sans-serif; color: var(--ink); background: var(--bg); }
      header { padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; }
      header h1 { font-size: 16px; margin: 0; }
      header .dim { color: var(--dim); font-size: 12px; }
      main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; align-items: start; }
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
      .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
      input, textarea, button, select { font: inherit; width: 100%; }
      input, textarea, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #fff; }
      button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover { background: #eef1f5; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      button.ghost { width: auto; padding: 3px 8px; font-size: 12px; }
      .row { display: flex; gap: 6px; }
      .item { padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
      .item:hover { background: #f2f4f7; }
      .item.on { border-color: #1f6feb; background: #eef4ff; }
      .node { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
      .node.cur { border-color: #1f6feb; box-shadow: 0 0 0 2px #e5efff; }
      .node h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
      .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #eef1f5; color: var(--dim); }
      .badge.pending { background: #eef1f5; }
      .badge.running { background: #fff4e0; color: #9a5b00; }
      .badge.awaiting_review { background: #e7f0ff; color: #1f4fa8; }
      .badge.accepted { background: #e4f7ea; color: #17683a; }
      .badge.rejected { background: #fdeaea; color: #a11f1f; }
      .cmt { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin: 6px 0; }
      .cmt .meta { font-size: 11px; color: var(--dim); }
      .cmt > div:not(.meta) { white-space: pre-wrap; }
      .cmt.reject { border-left-color: #a11f1f; }
      .cmt.approve { border-left-color: #17683a; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .actions button { width: auto; }
      .events { font: 12px/1.6 ui-monospace, monospace; color: var(--dim); max-height: 220px; overflow: auto; }
      .err { color: #a11f1f; font-size: 12px; min-height: 16px; }
      .dim { color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <h1>链条平台</h1>
      <span class="dim">节点六类 · 链首需求评估 · 链尾上线 · 位置由节点状态推导</span>
    </header>
    <main>
      <div>
        <div class="panel" style="margin-bottom: 16px">
          <h2>新建 project</h2>
          <input id="p-key" placeholder="key（如 demo）" />
          <input id="p-name" placeholder="名字" />
          <input id="p-repo" placeholder="仓库（如 owner/name）" />
          <button class="primary" onclick="createProject()">创建</button>
          <div class="err" id="p-err"></div>
        </div>
        <div class="panel">
          <h2>project 列表</h2>
          <div id="projects" class="dim">还没有 project</div>
        </div>
      </div>
      <div>
        <div class="panel" style="margin-bottom: 16px">
          <h2>提需求（进链即建分支）</h2>
          <textarea id="r-context" rows="3" placeholder="需求正文：fix bug 与新需求同等对待"></textarea>
          <input id="r-source" placeholder="提需求的人 / 渠道" />
          <button class="primary" onclick="createRequirement()">提交需求</button>
          <div class="err" id="r-err"></div>
        </div>
        <div class="panel">
          <h2>需求</h2>
          <div id="reqs" class="dim">先选一个 project</div>
          <div id="req"></div>
        </div>
      </div>
    </main>
    <script>
      const S = { project: null, reqId: null };
      const $ = (id) => document.getElementById(id);
      const el = (tag, attrs = {}, ...kids) => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : k.startsWith("on") ? (n[k] = v) : n.setAttribute(k, v);
        for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        return n;
      };
      async function api(method, path, body) {
        const res = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
        const text = await res.text();
        const data = text ? JSON.parse(text) : null;
        if (!res.ok) throw new Error(data?.error || res.status);
        return data;
      }
      async function createProject() {
        $("p-err").textContent = "";
        try {
          await api("POST", "/api/projects", { key: $("p-key").value, name: $("p-name").value, repo: $("p-repo").value });
          $("p-key").value = $("p-name").value = $("p-repo").value = "";
          await loadProjects();
        } catch (e) { $("p-err").textContent = e.message; }
      }
      async function loadProjects() {
        const ps = await api("GET", "/api/projects");
        const box = $("projects");
        box.className = "";
        box.replaceChildren(...(ps.length ? ps.map((p) => el("div", { class: "item" + (S.project === p.key ? " on" : ""), onclick: () => selectProject(p.key) }, el("b", {}, p.key), el("span", { class: "dim" }, "  " + (p.repo || "无仓库")), el("div", { class: "dim" }, p.chains.map((c) => c.key + "：" + c.nodes.map((n) => n.key).join(" → ")).join("；")))) : [el("div", { class: "dim" }, "还没有 project")]));
        if (!S.project && ps.length) selectProject(ps[0].key);
      }
      async function selectProject(key) {
        S.project = key;
        await loadProjects();
        await loadRequirements();
      }
      async function createRequirement() {
        $("r-err").textContent = "";
        if (!S.project) return ($("r-err").textContent = "先选一个 project");
        try {
          const req = await api("POST", `/api/p/${S.project}/requirements`, { context: $("r-context").value, source: $("r-source").value || "ui" });
          $("r-context").value = "";
          await loadRequirements();
          await openRequirement(req.id);
        } catch (e) { $("r-err").textContent = e.message; }
      }
      async function loadRequirements() {
        const rs = await api("GET", "/api/requirements");
        const box = $("reqs");
        const mine = rs.filter((r) => r.projectKey === S.project);
        box.className = "";
        box.replaceChildren(...(mine.length ? mine.map((r) => el("div", { class: "item" + (S.reqId === r.id ? " on" : ""), onclick: () => openRequirement(r.id) }, el("b", {}, r.id), " ", el("span", { class: "badge " + r.state }, r.state), el("div", { class: "dim" }, r.branch + " · " + r.context.slice(0, 40)))) : [el("div", { class: "dim" }, "这个 project 还没有需求")]));
      }
      async function openRequirement(id) {
        S.reqId = id;
        const { requirement: r, events } = await api("GET", "/api/requirements/" + id);
        const cur = r.nodes.findIndex((n) => n.state !== "accepted");
        const box = $("req");
        box.replaceChildren(
          el("div", { class: "dim" }, `分支 ${r.branch} · 状态 ${r.state} · 链 ${r.chainKey} v${r.chainVersion} · 需求 ${r.id}`),
          ...r.nodes.map((n) => nodeCard(r, n, n.index === (cur < 0 ? r.nodes.length - 1 : cur))),
          el("h2", { style: "margin-top:14px" }, "事件流（只追加）"),
          el("div", { class: "events" }, events.map((e) => el("div", {}, `${e.at.slice(11, 19)} ${e.action.padEnd(8)} ${e.node || "-"} ${e.from || ""}→${e.to || ""} ${e.detail || ""}`)))
        );
        await loadRequirements();
      }
      function nodeCard(r, n, isCur) {
        const msg = el("div", { class: "err" });
        const input = el("input", { placeholder: "这一步要留的话：通过意见 / 驳回理由 / 评论 / 追加的规则" });
        const act = (path, pick) => async () => {
          const value = input.value.trim();
          const body = pick(value);
          if (body === null) { msg.textContent = "这一步需要先写一句话"; return; }
          msg.textContent = "";
          try {
            await api("POST", `/api/requirements/${r.id}/nodes/${n.key}/${path}`, body);
            await openRequirement(r.id);
          } catch (e) { msg.textContent = e.message; }
        };
        return el("div", { class: "node" + (isCur ? " cur" : "") },
          el("h3", {}, n.key, el("span", { class: "badge " + n.state }, n.state), el("span", { class: "dim" }, `${n.type} · 审核 ${n.review} · 第 ${n.index + 1} 站`)),
          n.artifacts.length ? el("div", { class: "dim" }, "产物：" + n.artifacts.join("、")) : null,
          n.rules.length ? el("div", { class: "dim" }, "追加规则：" + n.rules.join("；")) : null,
          ...n.comments.map((c) => el("div", { class: "cmt " + (c.verdict || "") }, el("div", { class: "meta" }, `${c.authorType}/${c.author} · ${c.at.slice(11, 19)}`), el("div", {}, c.body))),
          input,
          el("div", { class: "actions" },
            el("button", { class: "ghost", onclick: act("run", () => ({})) }, n.type === "dev" || n.type === "merge" ? "开始动手" : "运行容器"),
            el("button", { class: "ghost", onclick: act("accept", (v) => ({ comment: v })) }, "通过"),
            el("button", { class: "ghost", onclick: act("reject", (v) => (v ? { reason: v } : null)) }, "驳回"),
            el("button", { class: "ghost", onclick: act("comment", (v) => (v ? { body: v } : null)) }, "评论"),
            el("button", { class: "ghost", onclick: act("rules", (v) => (v ? { rule: v } : null)) }, "追加规则")
          ),
          msg
        );
      }
      loadProjects();
    </script>
  </body>
</html>
